[platformio]
default_envs = mkrzero

; ; PlatformIO Project Configuration File 
[env:mkrzero]
 platform = atmelsam
 board = mkrzero
 framework = arduino
 test_framework = unity
 platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
 lib_deps = briscoetech/FreeRTOS_SAMD21 @ ^2.3.0
 monitor_port = /dev/ttyUSB0   ; check with: ls /dev/ttyUSB* /dev/ttyACM*
 monitor_speed = 9600